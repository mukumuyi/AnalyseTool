[project]
name = "analyse-tool"
version = "0.1.0"
description = "データ分析用ツールスクリプト集"
authors = [
    { name = "muku", email = "nishimoto.yutaka@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=7.0.0",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=2.3.3.260113",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
# 既定のimport-mode（prepend）は、__init__.pyの無いディレクトリ同士に
# 同名のテストファイル（例: tests/trial_factory/配下の複数ツールにある
# test_io.py）があるとモジュール名が衝突し、`uv run pytest`（全体実行）
# が失敗する。importlibモードはファイルパスから直接importするため
# __init__.py無しでも衝突しない（pytest公式が推奨する解決策）。
addopts = "--import-mode=importlib"

[tool.mypy]
# tests/配下は複数ツールで同名のテストファイル（test_io.py等）を使うため、
# __init__.pyの有無に頼らず名前空間パッケージとして扱い、ディレクトリ
# 構成からモジュール名を一意に解決させる（`Duplicate module named`回避）。
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
# plotly/duckdb/pyarrowは型スタブを配布していないため、既存の型チェックを
# 妨げないようにimportエラーだけを無視する（コード自体の型ヒントは維持する）。
module = ["plotly.*", "duckdb.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff.lint]
# DTZ（flake8-datetimez、タイムゾーン未指定のdatetime使用を禁止するルール）は
# 対象外にする。`docs/architecture.md`の前提通りローカルPCでの単一ユーザー
# 実行のみを想定しており、`output/`配下のファイル名・目次に使う実行日時は
# UTCではなくローカルの壁時計時刻であることが望ましいため。
ignore = ["DTZ"]
