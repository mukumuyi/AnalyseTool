[project]
name = "analyse-tool"
version = "0.1.0"
description = "データ分析用ツールスクリプト集"
authors = [
    { name = "muku", email = "nishimoto.yutaka@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=7.0.0",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=2.3.3.260113",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[[tool.mypy.overrides]]
# plotly/duckdbは型スタブを配布していないため、既存の型チェックを妨げない
# ようにimportエラーだけを無視する（コード自体の型ヒントは維持する）。
module = ["plotly.*", "duckdb.*"]
ignore_missing_imports = true

[tool.ruff.lint]
# DTZ（flake8-datetimez、タイムゾーン未指定のdatetime使用を禁止するルール）は
# 対象外にする。`docs/architecture.md`の前提通りローカルPCでの単一ユーザー
# 実行のみを想定しており、`output/`配下のファイル名・目次に使う実行日時は
# UTCではなくローカルの壁時計時刻であることが望ましいため。
ignore = ["DTZ"]
