[project]
name = "analyse-tool"
version = "0.1.0"
description = "データ分析用ツールスクリプト集"
authors = [
    { name = "muku", email = "nishimoto.yutaka@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=7.0.0",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# src/analyse_tool/__init__.py がまだ存在しない（実体は docs/reference/ に
# ステージング中）ため、自身をビルド対象パッケージとして扱わせない。
# src/analyse_tool/ を作って本採用したら、この節ごと削除してよい。
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
