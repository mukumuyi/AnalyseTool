[project]
name = "analyse-tool"
version = "0.1.0"
description = "データ分析用ツールスクリプト集"
authors = [
    { name = "muku", email = "nishimoto.yutaka@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=7.0.0",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=2.3.3.260113",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "tomli>=2 ; python_full_version < '3.11'",
]

# 品質チェックの設定。docs/reference/ は本採用前の参考実装（同名パッケージ analyse_tool の
# コピーを含む）なので、ruff・mypy の対象から外す。.claude/skills/gstack/ は同梱した外部ツール
# （GStack）なので同様に外す。
[tool.ruff]
extend-exclude = ["docs/reference", ".claude/skills/gstack"]

[tool.mypy]
mypy_path = "src"
exclude = ["^docs/reference/", "^\\.claude/skills/gstack/"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

# plotly は型情報（py.typed）を同梱していないため、import の型チェックを省く。
[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
